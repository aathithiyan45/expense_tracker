{% extends 'base.html' %}
{% load static %}

{% block content %}
<h1>Add Expense</h1>

<form method="post" action="{% url 'add_expense' %}">
    {% csrf_token %}
    <label for="id_category">Category:</label>
    <select name="category" id="id_category">
        {% for choice in form.category.field.choices %}
            <option value="{{ choice.0 }}" {% if choice.0 == form.category.value %} selected {% endif %}>{{ choice.1 }}</option>
        {% endfor %}
        <option value="Other" {% if form.category.value == 'Other' %} selected {% endif %}>Other</option>
    </select>

    <!-- Custom category input field -->
    <div id="custom-category-field">
        <label for="id_new_category">Custom Category:</label>
        <input type="text" name="new_category" id="id_new_category" placeholder="Enter custom category">
    </div>

    <label for="id_amount">Amount:</label>
    {{ form.amount }}

    <label for="id_description">Description:</label>
    {{ form.description }}

    <label for="id_date">Date:</label>
    {{ form.date }}

    <button type="submit">Save Expense</button>
</form>

<script>
    const categoryDropdown = document.getElementById('id_category');
    const customCategoryField = document.getElementById('custom-category-field');

    categoryDropdown.addEventListener('change', () => {
        if (categoryDropdown.value === 'Other') {
            customCategoryField.style.display = 'block';
        } else {
            customCategoryField.style.display = 'none';
        }
    });

    // Pre-fill the custom category field if 'Other' is selected
    if (categoryDropdown.value === 'Other') {
        customCategoryField.style.display = 'block';
    } else {
        customCategoryField.style.display = 'none';
    }
</script>
{% endblock %}
